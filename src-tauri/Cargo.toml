[package]
name = "weft-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.5.0"
sys-locale = "0.3.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2"
weft-core = { version = "0.1.0", path = "../crates/weft-core" }
weft-ls = { version = "0.1.0", path = "../crates/weft-ls" }

