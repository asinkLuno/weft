# 哈利·波特与魔法石 —— 按 weft 技能「三遍阅读法」从 tests/哈利·波特与魔法石/ 原文提炼的故事文档
# 第一遍：story + entity（含归属与关系）；第二遍：event；第三遍：narrative。
# 事件时间以原文相对锚点推算：哈利生日 7 月 31 日为主锚点 &birthday，开学日 9 月 1 日为期末链锚点。

story:
  title: 哈利·波特与魔法石
  author: J.K. 罗琳
  calculatable_props:
    constellation: constellation.rn
  description: >-
    十一岁的哈利·波特进入霍格沃茨魔法学校，
    与同伴一起揭开魔法石的秘密。

# =====================================================================
# 第一遍：实体（kind 为自定义字段，收进 extra_props）
# =====================================================================
entity:
  # —— 主角三人组 ——
  哈利·波特:
    kind: 人物
    description: 大难不死的男孩，额留闪电伤疤，寄居姨妈家碗柜十年，十一岁生日夜得知巫师身份；一年级即成为百年来最年轻的魁地奇找球手。
    base_time: [1980, 7, 31]
    belong_to: [波特一家, 格兰芬多, 格兰芬多魁地奇队]
    calculable_props: [constellation]
    wand: 冬青木魔杖，凤凰羽毛杖芯
  罗恩:
    kind: 人物
    description: 韦斯莱家第六个上霍格沃茨的孩子，哈利在特快上结识的挚友，巫师棋好手，用哥哥查理的旧魔杖。
    belong_to: [格兰芬多, 韦斯莱家族]
  赫敏:
    kind: 人物
    description: 麻瓜出身的一年级新生，开学前已背熟全部课本，成绩拔尖；巨怪事件后与哈利罗恩结为挚友。
    belong_to: [格兰芬多]
  纳威:
    kind: 人物
    description: 圆脸健忘的同院同学，总弄丢蟾蜍，飞行课摔断手腕，年终因挺身阻拦三人而获得学院加分。
    belong_to: [格兰芬多]

  # —— 同学 ——
  马尔福:
    kind: 人物
    description: 纯血世家出身的傲慢同学，自称全家都从斯莱特林毕业，入学前就想拉拢哈利被拒，自此处处与三人组作对。
    belong_to: [斯莱特林]
  克拉布:
    kind: 人物
    description: 马尔福的跟班，胳膊粗脑子钝。
    belong_to: [斯莱特林]
  高尔:
    kind: 人物
    description: 马尔福的跟班，与克拉布形影不离，在特快上被斑斑咬伤了手。
    belong_to: [斯莱特林]
  珀西:
    kind: 人物
    description: 韦斯莱家的级长，总把级长徽章擦得锃亮，爱摆架子。
    belong_to: [格兰芬多, 韦斯莱家族]
  弗雷德:
    kind: 人物
    description: 韦斯莱孪生兄弟之一，格兰芬多击球手，爱开玩笑，帮哈利抬箱子上车。
    belong_to: [格兰芬多, 韦斯莱家族, 格兰芬多魁地奇队]
  乔治:
    kind: 人物
    description: 韦斯莱孪生兄弟之一，与弗雷德形影不离，同样是击球手。
    belong_to: [格兰芬多, 韦斯莱家族, 格兰芬多魁地奇队]
  金妮:
    kind: 人物
    description: 韦斯莱家最小的孩子，年纪尚不能入学，在站台上缠着要看哈利·波特。
    belong_to: [韦斯莱家族]
  查理:
    kind: 人物
    description: 罗恩的二哥，在罗马尼亚研究龙，曾当过出色的找球手，安排朋友接走了诺伯。
    belong_to: [韦斯莱家族]
  韦斯莱太太:
    kind: 人物
    description: 韦斯莱兄弟们的母亲，在国王十字车站指点哈利冲进9又3/4站台。
    belong_to: [韦斯莱家族]

  # —— 教职员 ——
  阿不思·邓布利多:
    kind: 人物
    description: 霍格沃茨校长，魔法石的受托保管人；巧克力蛙画片记载他于一九四五年击败黑巫师格林德沃。
    belong_to: [格兰芬多, 霍格沃茨魔法学校]
  麦格教授:
    kind: 人物
    description: 霍格沃茨副校长，变形术教师兼格兰芬多院长，开学宴上主持分院，撞见哈利飞行后不罚反赏荐他为找球手。
    belong_to: [格兰芬多, 霍格沃茨魔法学校]
  斯内普教授:
    kind: 人物
    description: 魔药课教师兼斯莱特林院长，课上处处刁难哈利，腿伤成谜；实则比赛场上念反咒暗中保护哈利。
    belong_to: [斯莱特林, 霍格沃茨魔法学校]
  奇洛教授:
    kind: 人物
    description: 黑魔法防御术教师，说话结巴、总裹着头巾——伏地魔就附在他的后脑。
    belong_to: [霍格沃茨魔法学校]
  海格:
    kind: 人物
    description: 钥匙保管员兼狩猎场看守，骑着摩托车把襁褓中的哈利送到女贞路；酒后向兜帽陌生人泄露了制服路威的秘密。
    belong_to: [霍格沃茨魔法学校]
  费尔奇:
    kind: 人物
    description: 学校管理员，与学生们为敌，半夜带着猫巡查走廊抓夜游者。
    belong_to: [霍格沃茨魔法学校]
  霍琦夫人:
    kind: 人物
    description: 飞行课教师，灰发鹰眼，兼魁地奇比赛裁判。
    belong_to: [霍格沃茨魔法学校]
  伍德:
    kind: 人物
    description: 格兰芬多魁地奇队队长兼守门员，痴迷夺冠，亲自给哈利开小灶训练。
    belong_to: [格兰芬多, 格兰芬多魁地奇队]
  马库斯·弗林特:
    kind: 人物
    description: 斯莱特林魁地奇队队长，比赛中恶意冲撞哈利。
    belong_to: [斯莱特林, 斯莱特林魁地奇队]
  奥利凡德:
    kind: 人物
    description: 对角巷魔杖店主人，记得每一根卖出的魔杖；「不是巫师选魔杖，是魔杖选巫师」。

  # —— 反派与场外关键人物 ——
  伏地魔:
    kind: 人物
    description: 杀害哈利父母的黑巫师，讳称「神秘人」；杀哈利时咒语失灵、形神俱损，靠独角兽血苟延残喘，附身奇洛潜回霍格沃茨谋取魔法石。
  詹姆·波特:
    kind: 人物
    description: 哈利的父亲，当年霍格沃茨男生学生会主席，隐形衣是他的遗物；十年前万圣节前夕遇害。
    belong_to: [波特一家]
  莉莉·波特:
    kind: 人物
    description: 哈利的母亲，佩妮的妹妹，哈利继承了她的绿眼睛；牺牲前的母爱成为哈利最强大的护身符。
    belong_to: [波特一家]
  佩妮:
    kind: 人物
    description: 哈利的姨妈，莉莉的姐姐，瘦削金发长脖子，绝口不提自家有女巫亲戚。
    belong_to: [德思礼一家]
  弗农·德思礼:
    kind: 人物
    description: 哈利的姨父，格朗宁钻机公司主管，烧信、钉死信箱口、举家逃到海上礁石，只为躲开霍格沃茨的信。
    belong_to: [德思礼一家]
  达力:
    kind: 人物
    description: 德思礼夫妇娇纵的独子，生日收三十九件礼物、还嫌少两件，动物园那天被海格变出一条猪尾巴。
    belong_to: [德思礼一家]
  尼可·勒梅:
    kind: 人物
    description: 魔法石的惟一制造者，隐居德文郡的炼金术士，去年刚庆祝六百六十五岁生日；与邓布利多至交，石头销毁后他将平静赴死。
  费伦泽:
    kind: 人物
    description: 禁林里的白金色年轻马人，让哈利骑在背上救了他，并点破饮独角兽血者正是伏地魔。

  # —— 团体 ——
  霍格沃茨魔法学校:
    kind: 团体
    description: 世界上最优秀的魔法学校，学期每年九月一日开始，下设四大学院，楼梯会动、幽灵游荡。
  格兰芬多:
    kind: 团体
    description: 四学院之一，崇尚勇气，多年未得学院杯，年终宴会上靠最后一刻的加分逆转夺魁。
    belong_to: [霍格沃茨魔法学校]
  斯莱特林:
    kind: 团体
    description: 四学院之一，据说变坏的巫师多出于此，连年蝉联学院杯，直到年终宴会被格兰芬多反超。
    belong_to: [霍格沃茨魔法学校]
  赫奇帕奇:
    kind: 团体
    description: 四学院之一，以忠诚坚忍著称。
    belong_to: [霍格沃茨魔法学校]
  拉文克劳:
    kind: 团体
    description: 四学院之一，以睿智博学著称。
    belong_to: [霍格沃茨魔法学校]
  格兰芬多魁地奇队:
    kind: 团体
    description: 格兰芬多的学院球队，查理走后连年未胜，十一月首战大胜斯莱特林。
    belong_to: [格兰芬多]
  斯莱特林魁地奇队:
    kind: 团体
    description: 斯莱特林的学院球队，扫帚好、打法狠，首战被格兰芬多反超。
    belong_to: [斯莱特林]
  韦斯莱家族:
    kind: 团体
    description: 红头发、孩子众多的巫师世家，家境清寒而温暖，全家人都出自格兰芬多。
  德思礼一家:
    kind: 团体
    description: 住在萨里郡女贞路四号的麻瓜家庭，自诩非常规矩、与一切古怪事宜不沾边——直到哈利被放在门口。
  波特一家:
    kind: 团体
    description: 詹姆、莉莉与哈利的小家庭，一九八一年万圣节前夕在高锥克山谷遇袭，只有哈利幸存。
  魔法部:
    kind: 团体
    description: 魔法世界的政府部门，主责不让麻瓜发现巫师；一封魔法部紧急信件在关键时刻把邓布利多调离了学校。

  # —— 地点 ——
  高锥克山谷:
    kind: 地点
    description: 波特一家生前居住的村庄，伏地魔在此杀害了詹姆和莉莉。
  女贞路四号:
    kind: 地点
    description: 德思礼家的住址，襁褓中的哈利被放在门前台阶上，一住十年。
  礁石上的小屋:
    kind: 地点
    description: 海上礁石里的破屋，德思礼一家躲信件的尽头，海格在暴风雨夜破门而入。
  对角巷:
    kind: 地点
    description: 破釜酒吧后墙通往的鹅卵石巫师商业街，摩金夫人长袍店、奥利凡德魔杖店与丽痕书店所在。
  破釜酒吧:
    kind: 地点
    description: 麻瓜视而不见的阴暗小酒吧，哈利在这里第一次被巫师们围观致意。
  古灵阁:
    kind: 地点
    description: 妖精经营的巫师银行，深入伦敦地下数百英里；七月三十一日曾发生一起未遂闯入。
  9又3/4站台:
    kind: 地点
    description: 国王十字车站第9、10站台之间的魔法检票口，径直冲过即登霍格沃茨特快。
  礼堂:
    kind: 地点
    description: 四张长桌与漂浮蜡烛的大厅，天花板施咒如夜空，开学宴、万圣节宴与年终宴会都在此举行。
  女厕所:
    kind: 地点
    description: 赫敏躲起来哭的地方，万圣节夜的巨怪在这里被打昏。
  魁地奇球场:
    kind: 地点
    description: 看台环绕的球场，两端立着五十英尺高的金色球门柱。
  禁林:
    kind: 地点
    description: 校园边缘的禁地，独角兽接连遇害，哈利在此撞见啜饮独角兽血的兜帽身影。
  海格小屋:
    kind: 地点
    description: 禁林边缘的单间木屋，哈利常来喝茶，诺伯在这里破壳。

  # —— 道具与动物 ——
  哈利的魔杖:
    kind: 道具
    description: 冬青木、十一英寸、凤凰羽毛杖芯——与伏地魔的紫杉木杖出自同一只凤凰，兄弟魔杖。
  海德薇:
    kind: 动物
    description: 海格送哈利的十一岁生日礼物，一只雪鸮，替他往来送信。
  斑斑:
    kind: 动物
    description: 珀西转赠罗恩的灰鼠，嗜睡，在特快上咬了高尔的手。
  分院帽:
    kind: 道具
    description: 会唱会想的旧巫师帽，决定新生去哪个学院；它本想把哈利分入斯莱特林，依他的意愿改判格兰芬多。
  记忆球:
    kind: 道具
    description: 握紧时变红即提示忘事；纳威被马尔福抢走的正是它，哈利俯冲接住而入魁地奇队。
  光轮2000:
    kind: 道具
    description: 麦格教授匿名送给哈利的最新款飞天扫帚，首赛中疑遭恶咒而疯狂甩动。
  隐形衣:
    kind: 道具
    description: 哈利父亲的遗物，圣诞节清晨匿名送还，附字条「你父亲死前留下这件东西给我」。
  厄里斯魔镜:
    kind: 道具
    description: 照出内心最深渴望的魔镜，哈利在镜中看见亡故的家人；邓布利多后来把它改造成藏匿魔法石的机关。
  魔法石:
    kind: 道具
    description: 点石成金、炼出长生不老药的奇迹之石，尼可·勒梅的惟一杰作；先藏于古灵阁713号金库，后移入霍格沃茨地下，年终与勒梅商定销毁。
  路威:
    kind: 动物
    description: 海格从希腊人手里买来的三头巨犬，闻音乐即睡，借给邓布利多看守活板门下的魔法石。
  牙牙:
    kind: 动物
    description: 海格的猎狗，看着凶其实胆小，禁林禁闭时最先逃跑。
  诺伯:
    kind: 动物
    description: 海格玩牌赢来的龙蛋孵出的挪威脊背龙，破壳数周后被查理的朋友连夜接往罗马尼亚。
  巨怪:
    kind: 动物
    description: 万圣节夜闯进城堡的十二英尺巨怪，在女厕所被罗恩用漂浮咒打昏。

