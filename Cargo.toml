[workspace]
resolver = "3"
members = ["crates/weft-core", "crates/weft-cli", "src-tauri"]
default-members = ["crates/weft-cli"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
