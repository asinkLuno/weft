[workspace]
resolver = "3"
members = ["crates/weft-core", "crates/weft-ls", "crates/weft-cli", "src-tauri"]
default-members = ["crates/weft-cli"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[profile.release.package.rune]
opt-level = 3
