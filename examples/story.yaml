# weft 故事文档示例 —— 本文件即 YAML 数据模型 v0 的设计
# 后端对 schema 无感知（YAML↔JSON 透传），此结构是渲染器/前端的约定
story:
  title: 哈利·波特与魔法石
  author: J.K. 罗琳
  calculatable_props:
    constellation: constellation.rn
  description: >-
    十一岁的哈利·波特进入霍格沃茨魔法学校，
    与同伴一起揭开魔法石的秘密。

entity:
  霍格沃茨魔法学校:
    # avatar: images/hogwarts.png # 相对本 YAML 的图片路径；省略时显示 ID 缩写
    description: 英国的魔法学校，下设四大学院。

  格兰芬多:
    description: 以勇气著称的学院，院徽为狮子。
    belong_to: [霍格沃茨魔法学校]
  斯莱特林:
    description: 以野心著称的学院，院徽为蛇。
    belong_to: [霍格沃茨魔法学校]
  拉文克劳:
    description: 以智慧著称的学院，院徽为鹰。
    belong_to: [霍格沃茨魔法学校]
  赫奇帕奇:
    description: 以忠诚著称的学院，院徽为獾。
    belong_to: [霍格沃茨魔法学校]

  阿不思·邓布利多:
    description: 霍格沃茨校长，巧克力蛙卡片上的著名巫师，开学致辞常常只有几个词。
    base_time: 1881
    # 多父归属示例：既是格兰芬多出身，也直属霍格沃茨
    belong_to: [格兰芬多, 霍格沃茨魔法学校]

  # 霍格沃茨教师（人物表：麦格教授 / 斯内普教授 / 奇洛教授 / 海格）
  米勒娃·麦格:
    description: 霍格沃茨副校长，格兰芬多学院院长，开学宴上主持分院。
    base_time: [1935, 10, 4]
    belong_to: [霍格沃茨魔法学校, 格兰芬多]
    calculable_props: [constellation]
  西弗勒斯·斯内普:
    description: 魔药课教师，讲话阴阳怪气，上课处处刁难哈利。
    base_time: [1960, 1, 9]
    belong_to: [霍格沃茨魔法学校, 斯莱特林]
    calculable_props: [constellation]
  奇洛:
    description: 黑魔法防御术课教师，说话结巴，缠着头巾的头颅下另有乾坤。
    belong_to: [霍格沃茨魔法学校]
  鲁伯·海格:
    description: 钥匙保管员兼狩猎场看守，骑着摩托车把襁褓中的哈利送到女贞路。
    base_time: [1928, 12, 6]
    belong_to: [霍格沃茨魔法学校]
    calculable_props: [constellation]

  詹姆·波特:
    description: 哈利的父亲，格兰芬多击球手，掠夺者之首。
    base_time: [1960, 3, 27]
    belong_to: [格兰芬多]
  莉莉·波特:
    description: 哈利的母亲，麻瓜出身却天资出众的女巫。
    base_time: [1960, 1, 30]
    belong_to: [格兰芬多]

  哈利·波特:
    description: 大难不死的男孩，入学当晚被分院帽分入格兰芬多。
    base_time: [1980, 7, 31]
    belong_to: [格兰芬多]
    # 可计算属性：按 base_time 计算，结果写进 extra_props（星座名直接展示）
    calculable_props: [constellation]
    # 内置 key 之外的任意字段收进 extra_props 原样透传
    gender: 男
    wand: 冬青木魔杖，凤凰羽毛杖芯
  罗恩·韦斯莱:
    description: 哈利在火车上结识的好友，韦斯莱家幼子。
    base_time: [1980, 3, 1]
    belong_to: [格兰芬多]
    calculable_props: [constellation]
  赫敏·格兰杰:
    description: 麻瓜出身、成绩拔尖的女巫，与哈利罗恩同寝。
    base_time: [1979, 9, 19]
    belong_to: [格兰芬多]
    calculable_props: [constellation]
  纳威·隆巴顿:
    description: 健忘胆小的同院同学，蟾蜍莱夫总在跑丢。
    base_time: [1980, 7, 30]
    belong_to: [格兰芬多]
  金妮·韦斯莱:
    description: 韦斯莱家的小女儿，在国王十字车站送哥哥上学。
    base_time: [1981, 8, 11]
    belong_to: [格兰芬多]

  德拉科·马尔福:
    description: 纯血世家出身的傲慢男生，入学前就想拉拢哈利。
    base_time: [1980, 6, 5]
    belong_to: [斯莱特林]
    calculable_props: [constellation]
  文森特·克拉布:
    description: 德拉科的跟班，胳膊粗脑子钝。
    belong_to: [斯莱特林]
  格雷戈里·高尔:
    description: 德拉科的跟班，与克拉布形影不离。
    belong_to: [斯莱特林]

  帕德玛·佩蒂尔:
    description: 帕瓦蒂的双胞胎妹妹，分院礼上被分入拉文克劳。
    belong_to: [拉文克劳]

  汉娜·艾博:
    description: 分院礼上被分入赫奇帕奇的女生。
    belong_to: [赫奇帕奇]
  苏珊·博恩斯:
    description: 分院礼上被分入赫奇帕奇的女生。
    belong_to: [赫奇帕奇]
  贾斯廷·芬列里:
    description: 放弃麻瓜私立名校来读霍格沃茨的赫奇帕奇学生。
    belong_to: [赫奇帕奇]

  # 麻瓜世界（人物表：佩妮 / 弗农·德思礼 / 达力）；德思礼一家是独立归属树根
  德思礼一家:
    description: 住在萨里郡女贞路四号的麻瓜家庭，哈利寒暑假的落脚处。
  佩妮·德思礼:
    description: 哈利的姨妈，莉莉的姐姐，绝口不提自家有女巫亲戚。
    belong_to: [德思礼一家]
  弗农·德思礼:
    description: 哈利的姨父，一家之主，视一切不寻常之事为灾祸。
    belong_to: [德思礼一家]
  达力·德思礼:
    description: 德思礼夫妇的儿子，哈利的表哥，从小被惯得无法无天。
    base_time: [1980, 6, 23]
    belong_to: [德思礼一家]
    calculable_props: [constellation]

  # 反派（人物表：伏地魔）；不写 belong_to，自成一根
  伏地魔:
    description: 杀死哈利父母的黑魔王，人称「神秘人」，附在奇洛身上潜回霍格沃茨。
    base_time: [1926, 12, 31]
    # 内置 key 之外的任意字段收进 extra_props 原样透传
    real_name: 汤姆·里德尔
    calculable_props: [constellation]

# 实体关系：按组组织，每组是一批关系对；引用写实体 id
entity_link:
  波特一家:
    - entities: [哈利·波特, 莉莉·波特]
      relations: 母子
    - entities: [哈利·波特, 詹姆·波特]
      relations: 父子
    - entities: [莉莉·波特, 詹姆·波特]
      relations: 夫妻
  格兰芬多伙伴:
    - entities: [哈利·波特, 罗恩·韦斯莱]
      relations: 同学与朋友
    - entities: [哈利·波特, 赫敏·格兰杰]
      relations: 同学与朋友
    - entities: [罗恩·韦斯莱, 赫敏·格兰杰]
      relations: 同学与朋友

# 事件：事件 ID → 事件定义；嵌套列表首项为时间锚点
event:
  分院帽晚宴:
    start_time: &feast [1991, 9, 1, 19]
    end_time: [*feast, 0, 0, 0, 2] # 宴会两小时后结束
    entities: [哈利·波特, 罗恩·韦斯莱, 赫敏·格兰杰, 德拉科·马尔福]
    description: 开学宴会上分院帽把新生分入四大学院。
  厄里斯魔镜:
    start_time: [1991, 12, 25, 21]
    entities: [哈利·波特]
    description: 圣诞夜哈利在镜中看见了家人。
  蛇怪袭击:
    start_time: &basilisk [1993, 4, 20, 8]
    end_time: [*basilisk, 0, 0, 0, 6] # 锚点：自己开始后 6 小时
    entities: [金妮·韦斯莱]
    description: 金妮被里德的日记控制，打开密室。

# 叙事线：名称 → 事件 ID 列表
narrative:
  哈利的第一学年: [分院帽晚宴, 厄里斯魔镜, 蛇怪袭击]
