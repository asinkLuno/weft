[package]
name = "weft-cli"
version = "0.3.0"
edition = "2024"
description = "CLI linter and formatter for the WEFT story language"
license = "Apache-2.0"

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.10", features = ["derive"] }
ignore = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
weft-core = { version = "0.3.0", path = "../weft-core" }
weft-ls = { version = "0.3.0", path = "../weft-ls" }
