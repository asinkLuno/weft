[package]
name = "weft-core"
version = "0.3.0"
edition = "2024"
description = "Core parser, compiler, linter, and formatter for the WEFT story language"
license = "Apache-2.0"

[dependencies]
chumsky = "0.14.2"
petgraph = "0.8.3"
rune = "0.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
unicode-width = "0.2.3"
