[package]
name = "weft-core"
version = "0.2.0"
edition = "2024"
description = "Core parser, compiler, linter, and formatter for the Weft story language"

[dependencies]
chumsky = "0.14.2"
daggy = "0.9.0"
rune = "0.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
unicode-width = "0.2.3"
