exclude: ^tests/

repos:
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-front-matters==2.0.0

  - repo: local
    hooks:
      - id: mdsf-format
        name: mdsf format
        entry: mdsf format
        language: system
        types: [markdown]
        require_serial: true
